<nav class="portfolio-nav" aria-label="Main navigation" (keydown.escape)="menuOpen.set(false)">
  <div class="nav-bar">
    <a routerLink="/" fragment="home" (click)="menuOpen.set(false)" class="brand"><img src="/imges/logoo.webp" alt="Ahmed Khaled" width="660" height="168" decoding="async"></a>
    <div class="nav-links" [class.is-open]="menuOpen()" id="portfolio-menu">
      @for (section of sections; track section) {
        <a routerLink="/" [fragment]="section" (click)="menuOpen.set(false)" [class.active]="navigation.activeSection() === section" [attr.aria-current]="navigation.activeSection() === section ? 'location' : null">{{ 'navbar.' + section | translate }}</a>
      }
    </div>
    <div class="nav-actions">
      <button type="button" class="language-button" (click)="selectlang(lang === 'ar' ? 'en' : 'ar')" aria-label="Switch language"><svg class="fa-solid fa-globe" aria-hidden="true"><use href="/icons.svg#globe"></use></svg> {{ lang === 'ar' ? 'EN' : 'AR' }}</button>
      <app-toggel-component/>
      <button type="button" class="menu-button" (click)="menuOpen.set(!menuOpen())" aria-controls="portfolio-menu" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation"><svg class="fa-solid" aria-hidden="true"><use [attr.href]="menuOpen() ? '/icons.svg#xmark' : '/icons.svg#bars'"></use></svg></button>
    </div>
  </div>
</nav>
